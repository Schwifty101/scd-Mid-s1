<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FastBite</title>
<style>
  body{font-family:sans-serif;max-width:900px;margin:20px auto;padding:0 12px}
  section{border:1px solid #ccc;border-radius:6px;padding:10px;margin-bottom:14px}
  h2{margin:0 0 8px;font-size:18px} input,button{padding:5px;margin:2px}
  pre{background:#f4f4f4;padding:8px;overflow:auto;max-height:200px}
  td,th{border-bottom:1px solid #ddd;padding:4px 8px;text-align:left}
</style>
</head>
<body>
<h1>FastBite Food Court</h1>
<p id="mode" style="color:#a60"></p>

<section><h2>Menu (menu-service)</h2>
  <button onclick="loadMenu()">Refresh</button>
  <table id="menu"></table>
</section>

<section><h2>Customer (customer-service)</h2>
  <input id="cid" value="C-1042" size="8">
  <button onclick="show('cust','/customers/'+cid.value)">Get profile</button>
  <button onclick="addPoints()">Add 10 points</button>
  <pre id="cust"></pre>
</section>

<section><h2>Inventory (inventory-service)</h2>
  <button onclick="show('inv','/inventory')">Show stock</button>
  <pre id="inv"></pre>
</section>

<section><h2>Place order (order-service)</h2>
  <p>Cart: <span id="cart">empty</span> <button onclick="cart={};renderCart()">Clear</button></p>
  <button onclick="placeOrder()">Place order for customer above</button>
  <button onclick="show('orders','/orders')">List orders</button>
  <pre id="orders"></pre>
</section>

<section><h2>Pay (payment-service)</h2>
  <input id="oid" placeholder="ORD-XXXXXXXX"> <input id="amt" type="number" placeholder="amount">
  <button onclick="pay()">Pay</button>
  <button onclick="show('pays','/payments')">List payments</button>
  <pre id="pays"></pre>
</section>

<script>
const API = '/api', $ = id => document.getElementById(id);
let cart = {};


// ---- in-browser mock backend (same rules as the real services; resets on reload) ----
const db = {
  menu: [['M-101','Zinger Burger',450,'Burgers',80],['M-102','Fries',200,'Sides',120],
         ['M-103','Cold Drink',100,'Drinks',200],['M-104','Chai',80,'Drinks',150]]
         .map(([itemId,name,price,category,qty]) => ({itemId,name,price,category,available:true,qty})),
  customers: {'C-1042':{name:'Hamza Ali',email:'hamza.ali@example.com',points:150},
              'C-1043':{name:'Ayesha Khan',email:'ayesha.khan@example.com',points:20}},
  orders: [], payments: []
};
const rid = p => p + '-' + Math.random().toString(16).slice(2, 10).toUpperCase();
const cust = id => { const c = db.customers[id];
  return {customerId:id, name:c.name, email:c.email, loyaltyPoints:c.points, freeDrinkUnlocked:c.points >= 200}; };
function mock(path, method, b) {
  const [, root, id] = path.split('/');
  if (root === 'menu') return db.menu.map(({qty, ...m}) => m);
  if (root === 'customers') {
    if (id === 'update-points') {
      if (!db.customers[b.customerId]) return {error: 'Customer not found'};
      db.customers[b.customerId].points += b.points; return cust(b.customerId);
    }
    return db.customers[id] ? cust(id) : {error: 'Customer not found'};
  }
  if (root === 'inventory') return db.menu.map(m => ({itemId:m.itemId, name:m.name, quantity:m.qty}));
  if (root === 'orders') {
    if (method === 'GET') return id ? db.orders.find(o => o.orderId === id) || {error: 'Order not found'} : db.orders;
    if (!db.customers[b.customerId]) return {error: 'Customer not found'};
    if (!b.items.length) return {error: 'Cart is empty'};
    const lines = [];
    for (const {itemId, quantity} of b.items) {
      const m = db.menu.find(x => x.itemId === itemId);
      if (!m) return {error: `Item ${itemId} is not on the menu`};
      if (m.qty < quantity) return {error: `Insufficient stock for ${m.name}`, available: m.qty, requested: quantity};
      lines.push({itemId, name:m.name, price:m.price, quantity});
    }
    lines.forEach(l => db.menu.find(x => x.itemId === l.itemId).qty -= l.quantity);
    const total = lines.reduce((t, l) => t + l.price * l.quantity, 0), pointsEarned = Math.floor(total / 10);
    db.customers[b.customerId].points += pointsEarned;
    const o = {orderId: rid('ORD'), customerId: b.customerId, items: lines, total, status: 'CONFIRMED',
               pointsEarned, loyalty: cust(b.customerId)};
    db.orders.unshift(o); return o;
  }
  if (root === 'payments') {
    if (method === 'GET') return id ? db.payments.find(p => p.orderId === id) || {error: 'No payment found'} : db.payments;
    const o = db.orders.find(x => x.orderId === b.orderId);
    if (!o) return {error: 'Order not found'};
    if (o.status === 'PAID') return {error: 'Order is already paid'};
    if (b.amount !== o.total) return {error: 'Payment amount does not match the order total', orderTotal: o.total, received: b.amount};
    o.status = 'PAID';
    const p = {paymentId: rid('PAY'), orderId: o.orderId, amount: b.amount, status: 'PAID'};
    db.payments.unshift(p); return {message: 'Payment successful', ...p};
  }
  return {error: 'Not found'};
}

async function call(path, method = 'GET', body) {
  try {
    const r = await fetch(API + path, {
      method, headers: {'Content-Type': 'application/json'},
      body: body && JSON.stringify(body)
    });
    const j = await r.json();
    return j;
  } catch (e) {
    $('mode').textContent = 'Demo mode: no backend found, using in-browser mock data (resets on reload).';
    return mock(path, method, body); // no backend (e.g. GitHub Pages): use in-browser demo
  }
}
async function show(id, path) {
  $(id).textContent = JSON.stringify(await call(path), null, 2);
}
async function loadMenu() {
  const items = await call('/menu');
  if (!Array.isArray(items)) return $('menu').textContent = items.error || 'Could not load menu';
  $('menu').innerHTML = '<tr><th>ID</th><th>Name</th><th>Price</th><th></th></tr>' +
    items.map(i => `<tr><td>${i.itemId}</td><td>${i.name}</td><td>Rs. ${i.price}</td>
      <td><button onclick="add('${i.itemId}')">Add</button></td></tr>`).join('');
}
function add(id) { cart[id] = (cart[id] || 0) + 1; renderCart(); }
function renderCart() {
  $('cart').textContent = Object.entries(cart).map(([k, v]) => `${k} x${v}`).join(', ') || 'empty';
}
async function addPoints() {
  $('cust').textContent = JSON.stringify(
    await call('/customers/update-points', 'POST', {customerId: cid.value, points: 10}), null, 2);
}
async function placeOrder() {
  const items = Object.entries(cart).map(([itemId, quantity]) => ({itemId, quantity}));
  const o = await call('/orders', 'POST', {customerId: cid.value, items});
  $('orders').textContent = JSON.stringify(o, null, 2);
  if (o.orderId) { $('oid').value = o.orderId; $('amt').value = o.total; cart = {}; renderCart(); }
}
async function pay() {
  $('pays').textContent = JSON.stringify(
    await call('/payments', 'POST', {orderId: oid.value, amount: Number(amt.value)}), null, 2);
}
loadMenu();
</script>
</body>
</html>
